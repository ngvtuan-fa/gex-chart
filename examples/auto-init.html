<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlashAlpha GEX chart with HTML attributes</title>
</head>
<body style="margin:0;padding:24px;background:#0b1220">
  <div data-flashalpha-gex
       data-symbol="SPY"
       data-api-key="YOUR_FLASHALPHA_API_KEY"
       data-theme="dark"
       data-mode="compact"
       style="height:480px;max-width:960px"></div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@flashalpha/gex-charts@0/dist/gex-charts.min.js"></script>
</body>
</html>
